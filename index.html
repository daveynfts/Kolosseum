<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon-64.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Davey's Radar — VN KOL Map</title>
    <meta
      name="description"
      content="Davey's Radar — bản đồ KOL crypto Việt Nam, ma trận SCEX và side events Conviction."
    />
    <meta name="theme-color" content="#05060a" />
    <style>
      html, body, #root { height: 100%; margin: 0; background: #050814; }
      .boot-splash {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: rgba(255,255,255,.7);
        font-family: Inter, "Be Vietnam Pro", sans-serif;
      }
      .boot-splash__mark {
        width: 36px; height: 36px; border-radius: 11px;
        background: radial-gradient(circle at 28% 28%, rgba(125,211,252,.95), transparent 52%),
          radial-gradient(circle at 78% 72%, rgba(192,132,252,.85), transparent 48%),
          linear-gradient(145deg, rgba(255,255,255,.12), rgba(15,23,42,.5));
        border: 1px solid rgba(255,255,255,.22);
      }
      .boot-splash__title { margin: 0; font-weight: 650; color: #fff; }
      .boot-splash small { color: rgba(255,255,255,.45); font-size: 0.78rem; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-busy="true">
        <span class="boot-splash__mark" aria-hidden="true"></span>
        <p class="boot-splash__title">Davey's Radar</p>
        <small>Bấm avatar · Lọc rank · Mở Feed</small>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
