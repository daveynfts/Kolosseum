    <style>
      html, body, #root { height: 100%; margin: 0; background: #050814; }
      .boot-splash {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: rgba(255,255,255,.7);
        font-family: "Be Vietnam Pro", "Noto Sans", Inter, system-ui, sans-serif;
      }
      .boot-splash__mark {
        width: 36px; height: 36px; border-radius: 11px;
        object-fit: cover; display: block;
      }
      .boot-splash__title { margin: 0; font-weight: 650; color: #fff; }
      .boot-splash small { color: rgba(255,255,255,.45); font-size: 0.78rem; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-busy="true">
        <img class="boot-splash__mark" src="/logo.jpg" alt="" width="64" height="64" decoding="async" />
        <p class="boot-splash__title">Davey's Radar</p>
        <small>Bấm avatar · Lọc rank · Mở Feed</small>
      </div>
    </div>
    <script>
      // Keep the legacy Radar entry point unchanged; brand the arena before React loads.
      (() => {
        const path = location.pathname.toLowerCase()
        const arena = path === '/scex' || path.startsWith('/scex/') || path.startsWith('/reports/') || /^#\/?scex(?:[/?]|$)/i.test(location.hash)
        if (!arena) return
        document.title = 'Kolosseum — Đấu trường KOL crypto Việt Nam'
        const mark = document.querySelector('.boot-splash__mark')
        const title = document.querySelector('.boot-splash__title')
        const hint = document.querySelector('.boot-splash small')
        if (mark) mark.setAttribute('src', '/kolosseum-mark.svg')
        if (title) title.textContent = 'Kolosseum'
        if (hint) hint.textContent = 'Đấu trường KOL crypto Việt Nam'
        for (const icon of document.querySelectorAll('link[rel~="icon"]')) {
          icon.setAttribute('href', '/kolosseum-mark.svg')
          icon.setAttribute('type', 'image/svg+xml')
          icon.removeAttribute('sizes')
        }
        document.querySelector('link[rel="apple-touch-icon"]')?.setAttribute('href', '/kolosseum-icon-180.png')
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
